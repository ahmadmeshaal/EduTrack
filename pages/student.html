<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students</title>
    <link rel="stylesheet" href="../css/student.css" />
    <link rel="stylesheet" href="../css/NewStudent.css" />
  </head>
  <body>
    <div class="container">
      <span id="welcome"></span>

      <div class="top-bar">
        <input
          type="text"
          id="search"
          placeholder="Search students by name or ID..."
        />
        <select id="courseFilter" class="btn">
          <option value="all">All courses</option>
        </select>
        <button id="addBtn" class="btn btn-primary">+ Add new</button>
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>ID</th>
              <th>Grade</th>
              <th>Attendance</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <dialog id="modal" class="student-modal">
      <form id="form">
        <h3 id="modalTitle">Add student</h3>

        <!-- Keep this hidden input because student.js uses it -->
        <input type="hidden" id="studentId" />

        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
            required
          />
        </div>

    


        <div class="form-group">
          <label for="enrolledCourse">Enrolled Course</label>
          <select id="enrolledCourse">
            <option value="" disabled>Select a course</option>
          </select>
        </div>

        <div class="form-group">
          <label for="attendance">Attendance (%)</label>
          <input
            type="number"
            id="attendance"
            placeholder="Enter attendance percentage"
            min="0"
            max="100"
          />
        </div>

        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn btn-cancel">
            Cancel
          </button>

          <button type="submit" class="btn btn-save">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="../js/student.js"></script>
  </body>
</html>
