<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students</title>
    <link rel="stylesheet" href="CSS/student.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="searchbar">
        <span>⌕</span>
        <input type="text" placeholder="Search students by name or ID..." />
      </div>
       <select class="archive-btn">
      <option value="">Filter</option>
      <option value="os">OS</option>
      <option value="database">Database</option>
      <option value="cpp">C++</option>
    </select>

      <button class="add-btn">+ Add new</button>
    </header>

    <div class="table-wrapper">
      <table class="student-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>ID</th>
            <th>Grade</th>
            <th>Attendance</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="student-info">
              <span class="avatar">A</span>
              <span class="name">Ava Johnson</span>
            </td>
            <td class="student-id">ST-001</td>
            <td class="student-grade"><strong>A</strong> · 92%</td>
            <td class="student-attendance">96%</td>
            <td>
              <div class="actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-archive">Archive</button>
                <button class="btn-delete">Delete</button>
              </div>
            </td>
          </tr>

          <tr>
            <td class="student-info">
              <span class="avatar">A</span>
              <span class="name">Liam Smith</span>
            </td>
            <td class="student-id">ST-002</td>
            <td class="student-grade"><strong>B</strong> · 88%</td>
            <td class="student-attendance">87%</td>
            <td>
              <div class="actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-archive">Archive</button>
                <button class="btn-delete">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
