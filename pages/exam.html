<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack</title>
    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="stylesheet" href="/css/exam.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <aside class="sidebar">
      <!-- Logo / User -->
      <div class="profile">
        <div class="logo">S</div>
        <span>School manager</span>
      </div>

      <!-- Menu -->
      <nav class="menu">
        <a href="#/dashboard">
          <span class="icon">⊞</span>
          Dashboard
        </a>

        <a href="#/students">
          <span class="icon">♧</span>
          Students
        </a>

        <a href="#/assignments">
          <span class="icon">▣</span>
          Assignments
        </a>

        <a href="#/quizzes">
          <span class="icon">?</span>
          Quizzes
        </a>

        <a href="#/exams">
          <span class="icon">▤</span>
          Exams
        </a>

        <a href="#/grades">
          <span class="icon">⌁</span>
          Grades
        </a>
      </nav>

      <div class="help"></div>

      <div class="teacher">
        <div class="teacher-icon">M</div>

        <div>
          <strong>Ms. Rivera</strong>
          <span>Teacher</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="navbar">
        <div class="search">
          <span>⌕</span>
          <input type="text" placeholder="Search..." />
        </div>

        <button class="add-btn">+ Add new</button>

        <div class="user-icon">M</div>
      </header>

      <section class="Dynmic">
        <div class="exam-btn">
          <button class="add-exam-btn">Add Exam</button>
        </div>
        <div class="exam-cards">
          <div class="card">
            <i class="fa-regular fa-file"></i>
            <div class="info">
              <div></div>
              <span class="title">Mid-term</span>
              <span class="detail">
                <span>Major </span>
                <span>54 students </span>
                <span>Major </span>
              </span>
            </div>

            <div class="exam-actions">
              <button class="upcoming-tag">Upcoming</button>
              <button class="edit-tag">Edit</button>
              <button class="delete-tag">Delete</button>
            </div>
          </div>
        </div>
        <div class="exam-cards">
          <div class="card">
            <i class="fa-regular fa-file"></i>
            <div class="info">
              <div></div>
              <span class="title">Mid-term</span>
              <span class="detail">
                <span>Major </span>
                <span>54 students </span>
                <span>Major </span>
              </span>
            </div>

            <div>
              <button>Upcoming</button>
              <button>Edit</button>
              <button>Delete</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script></script>
  </body>
</html>
