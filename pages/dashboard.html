<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <select id="course-select" class="btn"></select>
      </div>

      <div class="row-1">
        <div class="item">
          <div class="stat-label">Total Students</div>
          <span id="total-student"> </span>
        </div>

        <div class="item">
          <div class="stat-label">Average grade</div>
          <span id="average-grade"> </span>
        </div>

        <div class="item">
          <div class="stat-label">Attendence rate</div>
          <span id="attendance-rate"> </span>
        </div>

        <div class="item">
          <div class="stat-label">Absences today</div>
          <span id="absences-today"> </span>
        </div>
      </div>

      <div class="row-2">
        <div class="item">
          Average grades
          <canvas id="c-average-grades"></canvas>
        </div>

        <div class="item">
          Absences vs. Grades
          <canvas id="c-scatter"></canvas>
        </div>
      </div>

      <div class="row-3">
        <div class="item">
          Attendance
          <span>
            <canvas id="c-attendance"></canvas>
          </span>
        </div>
      </div>

      <div class="row-4">
        <div class="item">
          Absences
          <span>
            <canvas id="c-absences"></canvas>
          </span>
        </div>
      </div>
    </div>

    <div class="row-3"></div>
    <script src="/js/dashboard.js" defer></script>
  </body>
</html>
