<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>

  <body>
    
    <aside class="sidebar">
      <div class="profile">
        <div class="logo">S</div>
        <span>School manager</span>
      </div>

      <nav class="menu">
        <a href="#/dashboard">
          <span class="icon"><i class="fa-solid fa-chalkboard-user"></i></span>
          Dashboard
        </a>

        <a href="#/students">
          <span class="icon"><i class="fa-solid fa-user-group"></i></span>
          Students
        </a>

        <a href="#/assignments">
          <span class="icon"><i class="fa-solid fa-clipboard-list"></i></span>
          Assignments
        </a>

        <a href="#/quizzes">
          <span class="icon"><i class="fa-solid fa-circle-question"></i></span>
          Quizzes
        </a>

        <a href="#/exams">
          <span class="icon"><i class="fa-solid fa-file-alt"></i></span>
          Exams
        </a>

        <a href="#/grades">
          <span class="icon"><i class="fa-solid fa-graduation-cap"></i></span>
          Grades
        </a>

        <a href="#/archive">
          <span class="icon"><i class="fa-solid fa-box-archive"></i></span>
          archive
        </a>
      </nav>

      <div class="help"></div>

      <div class="teacher">
        <div class="teacher-icon">M</div>

        <div>
          <strong id="name"></strong>
          <span>Teacher</span>
        </div>
        <div><button id="logout">logout <i class="fa-solid fa-right-from-bracket"></i></button></div>
      </div>
    </aside>

    <main class="main">
      <section class="Dynmic"></section>
    </main>

    <script src="/js/routing.js"></script>
    <script src="/js/logout.js"></script>
  </body>
</html>
