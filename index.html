<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>

  <body>
    <aside class="sidebar">
      <div class="profile">
        <div class="logo">S</div>
        <span>School manager</span>
      </div>

      <nav class="menu">
        <a href="#/dashboard">
          <span class="icon">⊞</span>
          Dashboard
        </a>

        <a href="#/students">
          <span class="icon">♧</span>
          Students
        </a>

        <a href="#/assignments">
          <span class="icon">▣</span>
          Assignments
        </a>

        <a href="#/quizzes">
          <span class="icon">?</span>
          Quizzes
        </a>

        <a href="#/exams">
          <span class="icon">▤</span>
          Exams
        </a>

        <a href="#/grades">
          <span class="icon">⌁</span>
          Grades
        </a>
      </nav>

      <div class="help"></div>

      <div class="teacher">
        <div class="teacher-icon">M</div>

        <div>
          <strong>Ms. Rivera</strong>
          <span>Teacher</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="navbar">
        <div class="search">
          <span>⌕</span>
          <input type="text" placeholder="Search..." />
        </div>

        <button class="add-btn">+ Add new</button>

        <div class="user-icon">M</div>
      </header>

      <section class="Dynmic"></section>
    </main>

    <script>
      const dynamic = document.querySelector(".Dynmic");

      function loadPage() {
        let page = location.hash;
        if (page === "#/students") {
          page = "../pages/student.html";
        } else if (page === "#/assignments") {
          page = "assignments.html";
        } else if (page === "#/quizzes") {
          page = "quizzes.html";
        } else if (page === "#/exams") {
          page = "exams.html";
        } else if (page === "#/grades") {
          page = "grades.html";
        } else {
          page = "dashboard.html";
        }

        fetch("/pages/" + page)
          .then((response) => response.text())
          .then((data) => {
            dynamic.innerHTML = data;
          });
      }

      window.addEventListener("hashchange", loadPage);

      loadPage();
    </script>
  </body>
</html>
