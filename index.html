<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f7f9f9;
        color: #18333b;
      }

      /* ================= SIDEBAR ================= */

      .sidebar {
        width: 260px;
        height: 100vh;

        position: fixed;
        left: 0;
        top: 0;

        background-color: white;
        border-right: 1px solid #e1e6e6;

        padding: 30px 16px;

        display: flex;
        flex-direction: column;
      }

      /* Logo + School manager */

      .profile {
        display: flex;
        align-items: center;
        gap: 12px;

        padding: 0 10px;
        margin-bottom: 30px;
      }

      .logo {
        width: 38px;
        height: 38px;

        background-color: #087f78;
        color: white;

        border-radius: 10px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 18px;
        font-weight: bold;
      }

      .profile span {
        color: #587079;
        font-size: 14px;
      }

      /* ================= MENU ================= */

      .menu {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .menu a {
        height: 44px;

        display: flex;
        align-items: center;

        gap: 14px;

        padding: 0 14px;

        text-decoration: none;
        color: #587079;

        border-radius: 11px;

        font-size: 15px;

        transition: 0.2s;
      }

      .menu a:hover {
        background-color: #edf5f4;
      }

      .menu a.active {
        background-color: #e4f0ee;
        color: #007d77;
        font-weight: 600;
      }

      .icon {
        width: 20px;
        text-align: center;
        font-size: 20px;
      }

      .help {
        margin-top: auto;

        padding: 18px 15px;
      }

      .help button {
        width: 100%;
        height: 40px;

        cursor: pointer;
      }

      /* ================= TEACHER ================= */

      .teacher {
        display: flex;
        align-items: center;
        gap: 12px;

        padding: 18px 10px 0;
      }

      .teacher-icon {
        width: 34px;
        height: 34px;

        background-color: #e4f0ee;
        color: #087f78;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .teacher strong {
        display: block;
        font-size: 14px;
      }

      .teacher span {
        display: block;
        margin-top: 3px;

        color: #71848a;
        font-size: 12px;
      }

      /* ================= MAIN ================= */

      .main {
        margin-left: 260px;
        min-height: 100vh;
      }

      /* ================= NAVBAR ================= */

      .navbar {
        height: 90px;

        display: flex;
        align-items: center;
        justify-content: flex-end;

        gap: 14px;

        padding: 0 35px;

        background-color: #f7f9f9;
      }

      /* Search */

      .search {
        width: 270px;
        height: 42px;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 0 13px;

        background-color: white;

        border: 1px solid #dfe5e5;
        border-radius: 10px;
      }

      .search span {
        font-size: 23px;
        color: #71848a;
      }

      .search input {
        width: 100%;

        border: none;
        outline: none;

        font-size: 14px;
      }

      .search input::placeholder {
        color: #71848a;
      }

      /* Add button */

      .add-btn {
        height: 44px;

        padding: 0 18px;

        background-color: #087f78;
        color: white;

        border: none;
        border-radius: 10px;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
      }

      .add-btn:hover {
        background-color: #066d67;
      }

      /* User icon */

      .user-icon {
        width: 42px;
        height: 42px;

        background-color: #e5f0ef;
        color: #087f78;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 14px;
      }

      /* ================= PAGE CONTENT ================= */

      .Issa {
        padding: 20px 35px 40px;
      }

      .page-title {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .page-description {
        color: #71848a;
        margin-bottom: 25px;
      }

      /* Cards */

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .card {
        background-color: white;
        border: 1px solid #e1e6e6;
        border-radius: 12px;
        padding: 25px;
      }

      .card h3 {
        margin-bottom: 10px;
      }

      .card p {
        color: #71848a;
        font-size: 14px;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 800px) {
        .sidebar {
          width: 210px;
        }

        .main {
          margin-left: 210px;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .search {
          width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <!-- Logo / User -->
      <div class="profile">
        <div class="logo">S</div>
        <span>School manager</span>
      </div>

      <!-- Menu -->
      <nav class="menu">
        <a href="#/dashboard">
          <span class="icon">⊞</span>
          Dashboard
        </a>

        <a href="#/students">
          <span class="icon">♧</span>
          Students
        </a>

        <a href="#/assignments">
          <span class="icon">▣</span>
          Assignments
        </a>

        <a href="#/quizzes">
          <span class="icon">?</span>
          Quizzes
        </a>

        <a href="#/exams">
          <span class="icon">▤</span>
          Exams
        </a>

        <a href="#/grades">
          <span class="icon">⌁</span>
          Grades
        </a>
      </nav>

      <div class="help"></div>

      <div class="teacher">
        <div class="teacher-icon">M</div>

        <div>
          <strong>Ms. Rivera</strong>
          <span>Teacher</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="navbar">
        <div class="search">
          <span>⌕</span>
          <input type="text" placeholder="Search..." />
        </div>

        <button class="add-btn">+ Add new</button>

        <div class="user-icon">M</div>
      </header>

      <section class="Dynmic"></section>
    </main>

    <script>
    </script>
  </body>
</html>
